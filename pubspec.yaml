name: vin_checker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dio: ^5.4.0
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  pdf: ^3.10.8
  printing: ^5.11.0
  google_mobile_ads: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4


flutter:

  uses-material-design: true


flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon-vin-checker-v2.png"
  adaptive_icon_background: "assets/icon/icon-vin-checker-v2-adaptive.png"
  adaptive_icon_foreground: "assets/icon/icon-vin-checker-v2-adaptive.png"



